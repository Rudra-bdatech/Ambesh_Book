    <!-- Instant Theme Detection Script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem("ambesh-theme");
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch(e) {}
      })();
    </script>
